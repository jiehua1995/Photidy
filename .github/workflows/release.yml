name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APK
    # Only the main branch produces releases; dev pushes stay untouched.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          name=$(grep -E '^photidy.versionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          code=$(grep -E '^photidy.versionCode=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

      # When the signing secrets are absent the Gradle build falls back to the debug key,
      # so the pipeline still produces installable artifacts for testing.
      - name: Configure signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "photidy.keystore.path=$RUNNER_TEMP/release.jks"
            echo "photidy.keystore.storePassword=$KEYSTORE_PASSWORD"
            echo "photidy.keystore.keyAlias=$KEY_ALIAS"
            echo "photidy.keystore.keyPassword=$KEY_PASSWORD"
          } >> gradle.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release
        run: bash ./gradlew test :app:assembleRelease --no-daemon --console=plain

      - name: Name artifact
        id: artifact
        run: |
          suffix=""
          if [ "${{ steps.signing.outputs.signed }}" = "false" ]; then
            suffix="-debug-signed"
          fi
          target="Photidy-${{ steps.version.outputs.name }}${suffix}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$target"
          echo "path=$target" >> "$GITHUB_OUTPUT"

      - name: Show signature
        run: |
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --print-certs "${{ steps.artifact.outputs.path }}" | grep 'Signer #1 certificate DN'

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.existing.outputs.found == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Photidy ${{ steps.version.outputs.name }}
          body: |
            Version ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})

            ${{ steps.signing.outputs.signed == 'true' && 'Signed with the project release key.' || 'Signed with the Android debug key — for testing only, not for store upload.' }}
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
